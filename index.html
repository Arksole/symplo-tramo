<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Symplo Tramo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F2F2; --card:#FFFFFF; --ink:#262626; --muted:#6B6B6B; --line:#D6D6D6;
  --L:#F5A43A; --D:#EE6F6F; --E:#1A1A1A; --on-E:#FFFFFF; --E-edge:#1A1A1A; --hi:#EAEAEA;
  --barH:130px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#161616; --card:#212121; --ink:#EDEDED; --muted:#9A9A9A; --line:#383838;
    --L:#F5A43A; --D:#EE6F6F; --E:#000000; --on-E:#FFFFFF; --E-edge:#8A8A8A; --hi:#2C2C2C;
  }
}
:root[data-theme="dark"]{
  --paper:#161616; --card:#212121; --ink:#EDEDED; --muted:#9A9A9A; --line:#383838;
  --L:#F5A43A; --D:#EE6F6F; --E:#000000; --on-E:#FFFFFF; --E-edge:#8A8A8A; --hi:#2C2C2C;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink)}
body{display:flex;flex-direction:column;overflow:hidden}
body{font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}
.num{font-variant-numeric:tabular-nums}
svg.ic{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Cabecera */
.top{flex:none;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:4px;font-size:16px;line-height:1;letter-spacing:-.3px;flex:none;white-space:nowrap;padding-right:10px;margin-right:2px;border-right:1px solid var(--line)}
.brand b{font-weight:700}
.brand span{font-weight:400;color:var(--muted)}
.row2{display:flex;align-items:center;gap:8px;padding:10px 0 6px}
.gps{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0}
.gps>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gps i{flex:none}
.gps i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted)}
.gps.on i{background:var(--ink);border-color:var(--ink)}
.hist-ctl{margin-left:auto;display:flex;gap:6px;flex:none}
.ctl{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:0;width:40px;height:38px;display:grid;place-items:center}
.ctl:disabled{opacity:.35;cursor:not-allowed}
.tabs{display:flex;gap:4px}
.tab{flex:1;background:none;border:none;border-bottom:2px solid transparent;padding:8px 2px 9px;font-weight:600;color:var(--muted);font-size:15px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
main>.wrap{padding-bottom:28px}
section[hidden]{display:none}
h2{font-weight:700;font-size:19px;margin:22px 0 6px}
.hint{color:var(--muted);font-size:14px;margin:0 0 10px}
.sbox{position:relative;margin:16px 0 4px}
.sbox .search{margin:0;padding-right:46px}
.search::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.sclear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:none;background:none;display:grid;place-items:center;color:var(--muted);padding:0}
.sclear[hidden]{display:none}
.search{width:100%;margin:16px 0 4px;padding:11px 13px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}

.dot{width:11px;height:11px;border-radius:50%;flex:none}
.dot.L{background:var(--L)} .dot.D{background:var(--D)} .dot.E{background:var(--E);box-shadow:0 0 0 1px var(--E-edge)}

/* Apartados */
details.sec{background:var(--card);border:1px solid var(--line);border-radius:8px;margin:8px 0;overflow:hidden}
details.sec>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;font-weight:600}
details.sec>summary::-webkit-details-marker{display:none}
.sn{font-weight:700;min-width:24px;font-variant-numeric:tabular-nums}
.count{margin-left:auto;font-size:13px;color:var(--muted);font-weight:500}
.chev{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:6px}
details[open] .chev{transform:rotate(225deg)}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}

.item{border-top:1px solid var(--line)}
.box .item:first-child{border-top:none}
.ihead{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px}
.ilabel{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;background:none;border:none;padding:6px 0;min-height:40px;min-width:0}
.ilabel .code{font-weight:700;min-width:50px;font-variant-numeric:tabular-nums}
.ilabel .t{flex:1}
.ilabel .n{font-weight:700;font-size:13px;border:1px solid var(--ink);border-radius:4px;padding:0 5px;margin-left:4px}
.lvb{display:flex;gap:5px;flex:none;justify-content:flex-end}
.lb{width:42px;height:42px;border-radius:6px;border:1.5px solid transparent;display:grid;place-items:center;padding:0}
.lb.L{background:var(--L);color:#2B1A00}
.lb.D{background:var(--D);color:#2A0505}
.lb.E{background:var(--E);color:var(--on-E);border-color:var(--E-edge)}
.lb.na{display:none}
.lb:active:not(:disabled){transform:scale(.94)}
.eye{width:36px;height:42px;border:none;background:none;display:grid;place-items:center;padding:0;color:var(--muted);flex:none}
.eye[aria-pressed="true"]{color:var(--ink)}
.eye:disabled{opacity:.25;cursor:not-allowed}
.idet{padding:0 14px 12px 14px}
.idet[hidden]{display:none}
.crit{border-left:3px solid var(--line);padding:4px 0 4px 10px;margin:8px 0}
.crit.L{border-color:var(--L)} .crit.D{border-color:var(--D)} .crit.E{border-color:var(--E-edge)}
.crit b{font-size:13px}
.crit p{margin:1px 0 0;font-size:14px}
.note{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font:inherit;font-size:15px;margin-top:6px}

/* Faltas */
.flist{list-style:none;margin:0;padding:0}
.frow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0}
.frow .code{font-weight:700;min-width:56px;font-variant-numeric:tabular-nums}
.frow .t{flex:1;font-size:15px}
.frow .t span{display:block;color:var(--muted);font-size:13px}
.frow a{color:var(--ink)}
.del{border:1px solid var(--line);background:none;border-radius:6px;padding:6px 10px;font-size:14px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:20px;text-align:center;color:var(--muted)}

/* Barra inferior */
.bar{flex:none;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:10px 0}
.bar .wrap{display:grid;grid-template-columns:1fr;gap:10px}
.barinfo{display:flex;align-items:center;gap:10px}
.clock{font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.clock.over{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px}
.tally{display:flex;gap:6px;margin-left:auto}
.chip{display:flex;align-items:center;gap:6px;padding:4px 9px;border:1px solid var(--line);border-radius:6px;background:var(--paper);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.barbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:1.5px solid var(--ink);background:var(--card);border-radius:8px;padding:11px 10px;font-weight:700;font-size:16px;min-height:48px}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.barbtns{position:relative}
.pop{position:absolute;right:0;bottom:calc(100% + 12px);width:min(340px,calc(100vw - 28px));background:var(--card);border:1.5px solid var(--ink);border-radius:10px;padding:14px;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.pop[hidden]{display:none}
.pop::after{content:"";position:absolute;right:calc(25% - 8px);bottom:-9px;width:14px;height:14px;background:var(--card);border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:rotate(45deg)}
.pop strong{display:block;font-size:16px;margin-bottom:4px}
.pop p{margin:0 0 12px;font-size:14px;color:var(--muted)}
.pop .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pop .acts button{border:1.5px solid var(--ink);background:var(--card);border-radius:8px;padding:10px;font-weight:700;font-size:15px}
.pop .acts .yes{background:var(--ink);color:var(--paper)}
@media (min-width:600px){.bar .wrap{grid-template-columns:auto 1fr;align-items:center}.barbtns{min-width:300px}.tally{margin-left:14px}}

/* Resultado */
.result{background:var(--card);border:1.5px solid var(--ink);border-radius:2px;margin:12px 0 18px;overflow:hidden}
.result .band{background:var(--ink);color:var(--paper);text-align:center;padding:12px 10px 14px}
.result .band p{margin:0;font-weight:500;font-size:14px}
.result .band strong{display:block;font-size:40px;line-height:1.1;letter-spacing:-.5px}
.rrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:11px 16px;border-top:1px solid var(--line)}
.rrow .codes{font-weight:600;font-size:18px;text-align:right;word-break:break-word;font-variant-numeric:tabular-nums}
.reason{padding:11px 16px;border-top:1px solid var(--line);font-size:15px}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;padding:9px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.route{border-top:1px solid var(--line);padding:10px 12px 12px}
.route .fallback svg{display:block;width:100%;height:auto;background:#ECECEC;border-radius:4px}
.attrc{display:flex;align-items:center;gap:4px;margin:0 6px 6px 0!important;font:11px/1.3 "Public Sans",system-ui,sans-serif;color:#333;max-width:calc(100% - 60px)}
.attrc .attr-i{flex:none;width:22px;height:22px;border-radius:50%;border:none;background:rgba(255,255,255,.85);color:#333;font:italic 700 13px/22px Georgia,serif;padding:0;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.attrc .attr-t{background:rgba(255,255,255,.85);border-radius:11px;padding:2px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attrc .attr-t a{color:#333;text-decoration:none}
.attrc.collapsed .attr-t{display:none}
.lmap{height:320px;border-radius:4px;overflow:hidden;background:#ECECEC;z-index:0}
.lmap .leaflet-tooltip{font-family:"Public Sans",system-ui,sans-serif;font-weight:700;font-size:12px;padding:1px 5px;color:#262626}
.fallback[hidden],.lmap[hidden]{display:none}
.route p{margin:6px 0 0;font-size:13px;color:var(--muted)}

/* Historial */
.hcard{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:8px 0}
.hcard header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{font-weight:700;font-size:13px;padding:2px 8px;border-radius:4px;border:1.5px solid #000;background:#FFFFFF;color:#000000}
.tag.no{background:#000000;color:#FFFFFF;border-color:#8A8A8A}
.hcard p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.hact{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:4px}
.confirm{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600;margin-top:6px}
.confirm[hidden]{display:none}
.confirm button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px 12px;font-weight:600}
.confirm .yes{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.freq{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.freq .code{font-weight:700}
.barv{height:6px;border-radius:3px;background:var(--hi);overflow:hidden;margin-top:3px}
.barv i{display:block;height:100%;background:var(--ink)}
.linkbtn[hidden]{display:none}
.linkbtn{background:none;border:none;color:var(--ink);font-weight:600;padding:8px 0;text-decoration:underline}

.toast{position:fixed;left:50%;bottom:calc(var(--barH) + 12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--paper);padding:9px 15px;border-radius:6px;font-weight:600;opacity:0;transition:all .15s;z-index:50;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Ajustes */
.sgroup{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.srow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.sgroup .srow:first-child{border-top:none}
.srow .sl{flex:1;min-width:0}
.srow .sl b{display:block;font-weight:600;font-size:15px}
.srow .sl span{display:block;font-size:13px;color:var(--muted)}
.srow.col{flex-direction:column;align-items:stretch}
.sw{flex:none;width:48px;height:28px;border-radius:14px;border:1.5px solid var(--line);background:var(--hi);position:relative;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--ink);border-color:var(--ink)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.sel{flex:none;max-width:52%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font:inherit;font-size:15px}
.sinput{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font:inherit;font-size:14px;margin-top:8px}
.sbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.sbtns:first-child{border-top:none}
.sbtn{border:1.5px solid var(--ink);background:var(--card);border-radius:8px;padding:10px;font-weight:600;font-size:15px}
.sbtn.primary{background:var(--ink);color:var(--paper)}
.sbtn:disabled{opacity:.35;cursor:not-allowed}
.sbtn.danger{border-color:var(--D)}
.sstat{padding:0 14px 12px;font-size:13px;color:var(--muted)}
body.big .lb{width:52px;height:52px}
body.big svg.ic{width:26px;height:26px}
body.notally .tally{visibility:hidden}
@media (max-width:420px){
  .clock{font-size:27px}
  .chip{padding:3px 7px;font-size:14px}
  .lb{width:38px;height:40px}.eye{width:32px;height:40px}
  .ilabel .code{min-width:44px}
  .ihead{padding-left:10px;gap:6px}
  svg.ic{width:20px;height:20px}
}
</style>

<body>

<header class="top">
  <div class="wrap">
    <div class="row2">
      <div class="brand" aria-label="Symplo Tramo"><b>Symplo</b><span>Tramo</span></div>
      <span class="gps" id="gps"><i></i><span id="gpsTxt">Ubicación inactiva</span></span>
      <div class="hist-ctl">
        <button class="ctl" id="undoBtn" aria-label="Deshacer" title="Deshacer"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
        <button class="ctl" id="redoBtn" aria-label="Rehacer" title="Rehacer"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-tab="hoja">Hoja</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="resultado">Resultado <span id="nF"></span></button>
      <button class="tab" role="tab" aria-selected="false" data-tab="historial">Historial</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="ajustes">Ajustes</button>
    </nav>
  </div>
</header>

<main id="main"><div class="wrap">
  <section id="tab-hoja">
    <div id="watchBlock">
    <h2>Puntos a vigilar</h2>
    <p class="hint" id="hojaHint"></p>
    <div id="quick"></div>
    </div>
    <div class="sbox"><input class="search" id="search" type="search" placeholder="Buscar código o palabra (peatones, calado…)" autocomplete="off"><button class="sclear" id="sclear" type="button" aria-label="Borrar búsqueda" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
    <div id="sections"></div>
  </section>

  <section id="tab-resultado" hidden>
    <div id="resultBox"></div>
    <h2 id="fTitle">Faltas anotadas</h2>
    <ul class="flist" id="flist"></ul>
  </section>

  <section id="tab-historial" hidden>
    <h2>Códigos que más se repiten</h2>
    <div id="freq"></div>
    <h2>Simulaciones anteriores</h2>
    <div id="hist"></div>
    <button class="linkbtn" id="clearHist">Borrar todo el historial</button>
  </section>

  <section id="tab-ajustes" hidden>
    <div id="settings"></div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </section>
</div></main>

<div class="bar" id="bar">
  <div class="wrap">
    <div class="barinfo">
      <div class="clock" id="clock">00:00</div>
      <div class="tally" aria-label="Recuento de faltas">
        <span class="chip" title="Leves"><span class="dot L"></span><span id="cL">0</span></span>
        <span class="chip" title="Graves"><span class="dot D"></span><span id="cD">0</span></span>
        <span class="chip" title="Eliminatorias"><span class="dot E"></span><span id="cE">0</span></span>
      </div>
    </div>
    <div class="barbtns">
      <button class="btn primary" id="startBtn">Iniciar</button>
      <button class="btn" id="finishBtn" aria-haspopup="dialog" aria-expanded="false">Finalizar prueba</button>
      <div class="pop" id="finishPop" role="dialog" aria-labelledby="popT" hidden>
        <strong id="popT">¿Finalizar la prueba?</strong>
        <p>Una vez finalizada no se podrán añadir, quitar ni editar faltas. El resultado se guardará en el historial.</p>
        <div class="acts"><button class="no" id="popNo">Seguir</button><button class="yes" id="popYes">Finalizar</button></div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const DATA = [
 {n:"1",t:"Comprobaciones previas",items:[
  ["1.1","Comprobaciones generales",{L:"No comprobar bien el estado del coche cuando lo pide el examinador: mandos, neumáticos, luces, niveles, claxon, batería, capó, chaleco, triángulos o documentación."}]
 ]},
 {n:"2",t:"Instalación en el vehículo",items:[
  ["2.1","Asiento",{L:"No adoptar la postura correcta."}],
  ["2.2","Espejos",{L:"No regular correctamente los retrovisores."}],
  ["2.3","Cinturón",{L:"No usar el cinturón o no ajustarlo bien."}]
 ]},
 {n:"3",t:"Incorporación a la circulación",items:[
  ["3.1","Observación",{L:"No observar el tráfico delante, detrás o a los lados."}],
  ["3.2","Señalización",{L:"Omitir el intermitente, ponerlo al contrario, tarde o no quitarlo al terminar."}],
  ["3.3","Ejecución",{D:"Incorporarse obstaculizando; usar mal el carril de aceleración o recorrer más de 15 m marcha atrás obstaculizando.",L:"Incorporación no gradual, con velocidad inadecuada, demorándola por inseguridad, más movimientos de los necesarios o golpear el bordillo."}]
 ]},
 {n:"4",t:"Progresión normal",items:[
  ["4.1","Carril adecuado",{D:"No circular por el carril derecho cuando toca, obstaculizando.",L:"No ir por el carril derecho, ir pegado al eje en vías de un carril por sentido o circular por el arcén."}],
  ["4.2","Separación frontal",{D:"Ir notablemente cerca del vehículo de delante (menos de la mitad de la distancia de seguridad)."}],
  ["4.3","Separación lateral",{E:"Reducir peligrosamente la separación con peatones o ciclistas.",D:"Reducir notablemente la separación con peatones, ciclistas, vehículos u obstáculos.",L:"Salirse de la calzada por ir muy pegado al borde."}],
  ["4.4","Velocidad adaptada",{E:"Velocidad inadecuada al estado de la vía o al tiempo, con riesgo.",D:"Velocidad anormalmente reducida sin causa, obstaculizando.",L:"Velocidad anormalmente reducida sin causa."}],
  ["4.5","Velocidad máxima",{E:"Exceder en más de 30 km/h el límite.",D:"Exceder entre 20 y 30 km/h.",L:"Exceder entre 10 y 20 km/h."}],
  ["4.6","Observación del entorno",{E:"Cruzar a velocidad excesiva un paso de peatones sin visibilidad lateral, o salpicar a otros causando riesgo.",D:"No facilitar el paso a vehículos de urgencia, detenerse sin necesidad obstaculizando o no ceder a peatones que suben o bajan del bus.",L:"No moderar la velocidad ante peatones o por el estado de la vía; detenerse sin necesidad detrás de un obstáculo por no anticiparlo."}]
 ]},
 {n:"5",t:"Desplazamientos laterales",items:[
  ["5.1","Observación",{D:"Reducir mucho la velocidad sin observar ni avisar.",L:"No observar el tráfico delante, detrás o a los lados antes de desplazarse."}],
  ["5.2","Señalización",{L:"Omitir el intermitente, ponerlo al contrario, tarde, demasiado pronto o no quitarlo."}],
  ["5.3","Ejecución",{E:"Obligar a modificar bruscamente la trayectoria a quien tiene prioridad en un tramo estrecho.",D:"Desplazarse obstaculizando a los de detrás o de frente, o sin separación frontolateral suficiente.",L:"Desplazamiento brusco o no entrar cuanto antes en el carril de deceleración."}]
 ]},
 {n:"6",t:"Adelantamientos",items:[
  ["6.1","Posición con el vehículo de delante",{D:"Empezar el adelantamiento notablemente pegado al de delante."}],
  ["6.2","Velocidad",{D:"Empezar demasiado lejos o adelantar con lentitud, obstaculizando.",L:"Empezar demasiado lejos o adelantar sin suficiente diferencia de velocidad."}],
  ["6.3","Selección del lugar",{E:"Adelantar en intersecciones sin visibilidad, en pasos de peatones, pasos a nivel o túneles de un carril.",D:"No adelantar cuando se le invita y las condiciones son idóneas, o adelantar obstaculizando el carril contiguo."}],
  ["6.4","Desplazamientos del adelantamiento",{E:"Adelantar obstaculizando a los que vienen de frente o sin la separación lateral reglamentaria.",D:"Demorar la vuelta al carril derecho obstaculizando.",L:"No observar, no señalizar bien o tardar en volver al carril derecho."}],
  ["6.5","Permitir el adelantamiento",{D:"Acelerar al ser adelantado o no ceñirse a la derecha, obstaculizando.",L:"Acelerar al ser adelantado o no ceñirse al borde derecho."}],
  ["6.6","Adelantar por la derecha",{D:"Adelantar por la derecha fuera de los casos permitidos."}]
 ]},
 {n:"7",t:"Intersecciones",items:[
  ["7.1","Observación",{L:"No observar el tráfico o la señalización, o tener que preguntar la dirección."}],
  ["7.2","Señalización",{L:"Omitir el intermitente, ponerlo al contrario, tarde, demasiado pronto, no mantenerlo o no quitarlo."}],
  ["7.3","Posición",{E:"Circular en sentido contrario dejando a la derecha una isleta, mediana o el centro de la rotonda.",D:"Posición inadecuada para el giro, obstaculizando.",L:"Posición inadecuada para o durante el cruce."}],
  ["7.4","Velocidad",{E:"Cruzar a velocidad inadecuada para las condiciones de la intersección.",D:"Llegar o cruzar a velocidad excesivamente reducida, obstaculizando.",L:"Aproximarse a velocidad inadecuada o excesivamente reducida."}],
  ["7.5","Detención",{E:"No detenerse obstaculizando al que tiene prioridad, a ciclistas o a peatones al girar.",D:"Detenerse sin necesidad o pasada la posición de entrada, obstaculizando.",L:"Frenazo ante semáforo, stop o ceda por no anticipar; detenerse antes de ganar visibilidad, sin necesidad o pasada la línea."}],
  ["7.6","Reanudación de la marcha",{E:"Al reanudar, obstaculizar al vehículo con prioridad.",D:"No reanudar en el momento oportuno, obstaculizando.",L:"No reanudar la marcha en el momento oportuno."}]
 ]},
 {n:"8",t:"Cambio de sentido",items:[
  ["8.1","Observación",{L:"No observar el tráfico."}],
  ["8.2","Señalización",{L:"Señalización omitida, al contrario, tardía o no quitada."}],
  ["8.3","Selección del lugar",{D:"Hacerlo en lugar prohibido, obstaculizando.",L:"Hacerlo en lugar prohibido."}],
  ["8.4","Ejecución",{E:"Tres o más movimientos atrás de los necesarios.",D:"Obstaculizar la circulación o dos movimientos de más.",L:"Un movimiento de más o golpear el bordillo."}]
 ]},
 {n:"9",t:"Paradas y estacionamientos",items:[
  ["9.1","Observación",{L:"No observar el tráfico."}],
  ["9.2","Señalización",{L:"Señalización omitida, al contrario, tardía o excesivamente anticipada."}],
  ["9.3","Selección del lugar",{D:"Lugar prohibido, obstaculizando.",L:"Lugar prohibido o hueco claramente inferior al coche."}],
  ["9.4","Ejecución",{E:"En línea, sobresalir más de la mitad respecto a los demás; en batería, más de 1 m invadiendo la calzada.",D:"En línea, sobresalir menos de la mitad; en batería, más de medio metro; invadir la acera obstaculizando a peatones.",L:"No dejarlo centrado u oblicuo, no usar bien el espacio, golpear el bordillo, no poner el freno de mano o la marcha adecuada en pendiente. Máximo 2 minutos."}]

/* Geolocalización */
let watchId=null, lastPos=null;
function setGps(state,txt){$("gps").classList.toggle("on",state==="on");$("gpsTxt").textContent=txt}
function startGps(){
  if(watchId!==null)return;
  if(!SET.gps){setGps("off","Ubicación desactivada en ajustes");return}
  if(!("geolocation" in navigator)){setGps("off","Ubicación no disponible");return}
  try{
    setGps("off","Buscando ubicación…");
    watchId=navigator.geolocation.watchPosition(p=>{
      lastPos={lat:+p.coords.latitude.toFixed(6),lon:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy),t:elapsed()};
      setGps("on",`Ubicación activa (±${lastPos.acc} m)`);
      const tr=S.track,prev=tr[tr.length-1];
      if(S.running&&(!prev||dist(prev,lastPos)>SET.gpsDist||lastPos.t-prev.t>20000)){tr.push(lastPos);if(tr.length>3000)tr.splice(0,tr.length-3000);save()}
    },err=>{
      setGps("off",err.code===1?"Ubicación bloqueada (permiso o visor)":"Ubicación no disponible en esta vista");
      stopGps();
    },{enableHighAccuracy:true,maximumAge:3000,timeout:20000});
  }catch(e){setGps("off","Ubicación no disponible en esta vista")}
}
function stopGps(){if(watchId!==null){try{navigator.geolocation.clearWatch(watchId)}catch(e){}watchId=null}}
function dist(a,b){const R=6371000,toR=x=>x*Math.PI/180;const dLa=toR(b.lat-a.lat),dLo=toR(b.lon-a.lon);
  const h=Math.sin(dLa/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const mapUrl=p=>`https://www.openstreetmap.org/?mlat=${p.lat}&mlon=${p.lon}#map=18/${p.lat}/${p.lon}`;

/* Baremo */
function evaluate(f){
  const L=f.filter(x=>x.lv==="L").length,D=f.filter(x=>x.lv==="D").length,E=f.filter(x=>x.lv==="E").length;
  let no=false,reason="Apto: menos de dos graves, menos de una grave con cinco leves y menos de diez leves.";
  if(E>=1){no=true;reason="No apto por una falta eliminatoria."}
  else if(D>=2){no=true;reason="No apto por dos faltas graves."}
  else if(D===1&&L>=5){no=true;reason="No apto por una grave y cinco leves."}
  else if(L>=10){no=true;reason="No apto por diez faltas leves."}
  return {L,D,E,no,reason};
}

/* Faltas con deshacer y rehacer */
function beginIfIdle(){if(!active()){S.running=true;S.start=Date.now();S.date=Date.now();S.track=[];startGps()}}
function addFault(code,lv,note){
  beginIfIdle();
  const f={id:Date.now()+Math.random(),code,lv,t:elapsed(),note:note||"",pos:lastPos?{lat:lastPos.lat,lon:lastPos.lon,acc:lastPos.acc}:null};
  S.faults.push(f);record({type:"add",f});
  if(SET.vibrate&&navigator.vibrate){try{navigator.vibrate(25)}catch(e){}}
  save();toast(`${code} anotada como ${LVNAME[lv].toLowerCase()}`);renderAll();
}
function removeFault(id){
  const i=S.faults.findIndex(x=>x.id===id);if(i<0)return;
  const [f]=S.faults.splice(i,1);record({type:"remove",f,i});
  save();toast(`Quitada ${f.code}`);renderAll();
}
function doAct(a,dir){
  const fwd=dir===1;
  switch(a.type){
    case "add": if(fwd)S.faults.push(a.f);else S.faults=S.faults.filter(x=>x.id!==a.f.id);save();
      return fwd?`Rehecha ${a.f.code}`:`Deshecha ${a.f.code}`;
    case "remove": if(fwd)S.faults=S.faults.filter(x=>x.id!==a.f.id);else S.faults.splice(Math.min(a.i,S.faults.length),0,a.f);save();
      return fwd?`Quitada ${a.f.code}`:`Recuperada ${a.f.code}`;
    case "watch": WATCH[a.c]=fwd?a.next:a.prev;store.set("dgtsim.watch",WATCH);
      return `${a.c} ${WATCH[a.c]?"añadido a":"quitado de"} puntos a vigilar`;
    case "hdel":
      if(fwd){HIST=HIST.filter(y=>y.id!==a.rec.id);if(a.wasLast)LAST=null}
      else{HIST.splice(Math.min(a.i,HIST.length),0,a.rec);if(a.wasLast)LAST=a.rec}
      saveHist();store.set("dgtsim.last",LAST);
      return fwd?"Simulación eliminada":"Simulación recuperada";
    case "wipe":
      if(fwd){HIST=[];LAST=null;WATCH={}}else{HIST=a.recs.slice();LAST=a.last;WATCH=Object.assign({},a.watch)}
      saveHist();store.set("dgtsim.last",LAST);store.set("dgtsim.watch",WATCH);
      return fwd?"Datos borrados":"Datos recuperados";
    case "import":
      if(fwd){HIST=a.after.hist.slice();LAST=a.after.last;WATCH=Object.assign({},a.after.watch)}
      else{HIST=a.before.hist.slice();LAST=a.before.last;WATCH=Object.assign({},a.before.watch)}
      saveHist();store.set("dgtsim.last",LAST);store.set("dgtsim.watch",WATCH);
      return fwd?"Copia importada":"Importación deshecha";
    case "hclear":
      if(fwd){HIST=[];LAST=null}else{HIST=a.recs.slice();LAST=a.last}
      saveHist();store.set("dgtsim.last",LAST);
      return fwd?"Historial borrado":"Historial recuperado";
  }
  return "";
}
function record(a){undoStack.push(a);redoStack=[]}
function undo(){const a=undoStack.pop();if(!a)return;const m=doAct(a,-1);redoStack.push(a);toast(m);renderAll()}
function redo(){const a=redoStack.pop();if(!a)return;const m=doAct(a,1);undoStack.push(a);toast(m);renderAll()}
function toggleWatch(c){const a={type:"watch",c,prev:!!WATCH[c],next:!WATCH[c]};record(a);toast(doAct(a,1));renderAll()}

function routeSvg(track,faults){
  const pts=[...track,...faults.filter(f=>f.pos).map(f=>f.pos)];
  let minLa=Infinity,maxLa=-Infinity,minLo=Infinity,maxLo=-Infinity;
  pts.forEach(p=>{minLa=Math.min(minLa,p.lat);maxLa=Math.max(maxLa,p.lat);minLo=Math.min(minLo,p.lon);maxLo=Math.max(maxLo,p.lon)});
  const k=Math.cos((minLa+maxLa)/2*Math.PI/180);
  const w=Math.max((maxLo-minLo)*k,1e-4),h=Math.max(maxLa-minLa,1e-4);
  const W=600,H=Math.round(Math.min(420,Math.max(220,W*h/w))),pad=24;
  const sc=Math.min((W-2*pad)/w,(H-2*pad)/h);
  const X=p=>pad+((p.lon-minLo)*k)*sc+((W-2*pad)-w*sc)/2, Y=p=>H-pad-(p.lat-minLa)*sc-((H-2*pad)-h*sc)/2;
  const line=track.length>1?`<polyline points="${track.map(p=>X(p).toFixed(1)+","+Y(p).toFixed(1)).join(" ")}" fill="none" stroke="#8A8A8A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`:"";
  const start=track.length?`<circle cx="${X(track[0])}" cy="${Y(track[0])}" r="6" fill="#FFFFFF" stroke="#262626" stroke-width="2"/>`:"";
  const marks=faults.filter(f=>f.pos).map(f=>{const x=X(f.pos),y=Y(f.pos);
    return `<g><circle cx="${x}" cy="${y}" r="8" fill="var(--${f.lv})" stroke="#262626" stroke-width="1.5"/><text x="${x+11}" y="${y+4}" font-size="13" font-weight="700" fill="#262626" font-family="Public Sans, sans-serif">${f.code}</text></g>`}).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Recorrido de la prueba con las faltas marcadas">${line}${start}${marks}</svg>`;
}
const MAPREC={};
function routeBlock(rec){
  const track=rec.track||[],pts=[...track,...rec.faults.filter(f=>f.pos).map(f=>f.pos)];
  if(!pts.length)return `<div class="route"><p>Sin datos de ubicación en esta prueba, así que no se puede dibujar el recorrido.</p></div>`;
  MAPREC[rec.id]=rec;
  return `<div class="route"><div class="lmap" data-rid="${rec.id}"></div><div class="fallback" hidden>${routeSvg(track,rec.faults)}</div><p class="rnote">Recorrido aproximado. El círculo blanco es la salida.</p></div>`;
}
const LVCOL={L:"#F5A43A",D:"#EE6F6F",E:"#000000"};
const _tp=["FR0IRF9YFRdAAlo=","EkpcFVlWS0JDUFoL","EBtcL1gLHh4tUDIJ"];
function _tq(){try{const s="symplo-tramo",b=atob(_tp.slice().reverse().join(""));let o="";for(let i=0;i<b.length;i++)o+=String.fromCharCode(b.charCodeAt(i)^s.charCodeAt(i%s.length));return o}catch(e){return ""}}

const isDark=()=>SET.theme==="dark"||(SET.theme==="auto"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
function tileCfg(){
  let st=SET.mapStyle;if(st==="auto")st=isDark()?"dark":"light";
  if(st!=="osm"&&!_tq())st="osm";
  const carto=n=>({url:`https://basemaps.cartocdn.com/rastertiles/${n.replace("rastertiles/","")}/{z}/{x}/{y}{r}.png?key=${encodeURIComponent(_tq())}`,opt:{maxZoom:20,
    attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/attributions">CARTO</a>'},dark:st==="dark"});
  if(st==="light")return carto(SET.mapLabels?"light_all":"light_nolabels");
  if(st==="dark")return carto(SET.mapLabels?"dark_all":"dark_nolabels");
  if(st==="roads")return carto(SET.mapLabels?"rastertiles/voyager":"rastertiles/voyager_nolabels");
  return {url:"https://tile.openstreetmap.org/{z}/{x}/{y}.png",opt:{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'},dark:false};
}
function initMaps(root){
  (root||document).querySelectorAll(".lmap:not([data-init])").forEach(el=>{
    el.dataset.init="1";const rec=MAPREC[el.dataset.rid];if(!rec)return;
    const wrap=el.parentNode,fb=wrap.querySelector(".fallback"),note=wrap.querySelector(".rnote");
    const fallback=msg=>{el.hidden=true;fb.hidden=false;if(msg)note.textContent=msg};
    if(!window.L){fallback("Mapa de calles no disponible en esta vista: se muestra solo el trazado. El círculo blanco es la salida.");return}
    try{
      const map=L.map(el,{zoomControl:true,attributionControl:false,scrollWheelZoom:false});
      let ok=0,bad=0,gaveUp=false;const tc=tileCfg(),ink=tc.dark?"#F2F2F2":"#262626";el.style.background=tc.dark?"#202020":"#ECECEC";
      const AC=L.Control.extend({options:{position:"bottomright"},onAdd(){
        const d=L.DomUtil.create("div","attrc");
        d.innerHTML=`<span class="attr-t">${tc.opt.attribution}</span><button class="attr-i" type="button" aria-label="Créditos del mapa" title="Créditos del mapa">i</button>`;
        L.DomEvent.disableClickPropagation(d);
        d.querySelector(".attr-i").onclick=()=>d.classList.toggle("collapsed");
        setTimeout(()=>d.classList.add("collapsed"),4000);return d}});
      new AC().addTo(map);
      L.tileLayer(tc.url,tc.opt)
        .on("tileload",()=>ok++)
        .on("tileerror",()=>{bad++;if(!ok&&bad>=3&&!gaveUp){gaveUp=true;map.remove();fallback("Mapa de calles no disponible en esta vista: se muestra solo el trazado. El círculo blanco es la salida.")}})
        .addTo(map);
      const track=(rec.track||[]).map(p=>[p.lat,p.lon]);const all=[...track];
      if(track.length>1)L.polyline(track,{color:ink,weight:SET.routeWidth,opacity:.8}).addTo(map);
      if(track.length)L.circleMarker(track[0],{radius:7,color:"#262626",weight:2,fillColor:"#FFFFFF",fillOpacity:1}).addTo(map).bindTooltip("Salida");
      rec.faults.filter(f=>f.pos).forEach(f=>{const p=[f.pos.lat,f.pos.lon];all.push(p);
        L.circleMarker(p,{radius:9,color:tc.dark?"#F2F2F2":"#262626",weight:1.5,fillColor:LVCOL[f.lv],fillOpacity:1}).addTo(map)
          .bindTooltip(f.code,{permanent:true,direction:"right",offset:[8,0]})});
      if(all.length===1)map.setView(all[0],17);else map.fitBounds(all,{padding:[28,28],maxZoom:18});
      setTimeout(()=>map.invalidateSize(),60);
    }catch(e){fallback("Mapa de calles no disponible: se muestra solo el trazado.")}
  });
}
function codesOf(f,lv){const a=f.filter(x=>x.lv===lv).map(x=>x.code);return a.length?a.join(" - "):"0"}
function resultCard(rec){
  const r=evaluate(rec.faults);const d=new Date(rec.date);
  return `<div class="result">
    <div class="meta"><span>Clase B, circulación</span><span class="num">${d.toLocaleDateString("es-ES")}, ${fmt(rec.ms)}</span></div>
    <div class="band"><p>Resultado de la simulación</p><strong>${r.no?"No apto":"Apto"}</strong></div>
    <div class="rrow"><span class="dot L"></span><span>Leves</span><span class="codes">${codesOf(rec.faults,"L")}</span></div>
    <div class="rrow"><span class="dot D"></span><span>Graves</span><span class="codes">${codesOf(rec.faults,"D")}</span></div>
    <div class="rrow"><span class="dot E"></span><span>Eliminatorias</span><span class="codes">${codesOf(rec.faults,"E")}</span></div>
    <div class="reason">${r.reason}</div>
    ${routeBlock(rec)}
  </div>`;
}
function faultRow(f,editable){
  const li=document.createElement("li");li.className="frow";
  const loc=f.pos?` <a href="${mapUrl(f.pos)}" target="_blank" rel="noopener">Ver ubicación</a>`:"";
  li.innerHTML=`<span class="dot ${f.lv}"></span><span class="code">${f.code}</span><span class="t">${INDEX[f.code].t}<span>${LVNAME[f.lv]}, minuto ${fmt(f.t)}${f.note?". "+esc(f.note):""}.${loc}</span></span>`;
  if(editable){const del=document.createElement("button");del.className="del";del.textContent="Quitar";del.onclick=()=>removeFault(f.id);li.appendChild(del)}
  return li;
}
function renderResult(){
  const ul=$("flist");ul.innerHTML="";
  if(active()||!LAST){
    $("resultBox").innerHTML=`<p class="hint" style="margin-top:18px">El resultado aparecerá aquí al finalizar la prueba.</p>`;
    $("fTitle").textContent="Faltas anotadas";
    if(!S.faults.length)ul.innerHTML=`<li class="empty">Aún no hay faltas. Anótalas desde la hoja.</li>`;
    S.faults.slice().reverse().forEach(f=>ul.appendChild(faultRow(f,true)));
  }else{
    $("resultBox").innerHTML=resultCard(LAST);initMaps($("resultBox"));
    $("fTitle").textContent="Faltas de la prueba";
    if(!LAST.faults.length)ul.innerHTML=`<li class="empty">Prueba sin faltas.</li>`;
    LAST.faults.forEach(f=>ul.appendChild(faultRow(f,false)));
  }
}
function renderHistory(){
  const h=$("hist");h.innerHTML="";$("clearHist").hidden=!HIST.length;
  if(!HIST.length)h.innerHTML=`<div class="empty">Cuando finalices una prueba aparecerá aquí, con sus códigos y su recorrido.</div>`;
  HIST.slice().reverse().forEach(x=>{
    const r=evaluate(x.faults);const c=document.createElement("div");c.className="hcard";
    c.innerHTML=`<header><strong>${new Date(x.date).toLocaleString("es-ES",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</strong><span class="tag ${r.no?"no":""}">${r.no?"No apto":"Apto"}</span></header>
      <p>${r.L} leves, ${r.D} graves y ${r.E} eliminatorias en ${fmt(x.ms)}.</p>
      <p>${x.faults.length?x.faults.map(f=>f.code+" ("+LVSHORT[f.lv]+")").join(", "):"Sin faltas"}</p>
      <div class="hact"><button class="linkbtn view">Ver hoja de resultado</button><button class="linkbtn delh">Eliminar</button></div>
      <div class="confirm" hidden><span>¿Eliminar esta simulación?</span><button class="yes">Eliminar</button><button class="no">Cancelar</button></div>
      <div class="hres"></div>`;
    const v=c.querySelector(".view"),box=c.querySelector(".hres"),cf=c.querySelector(".confirm");
    v.onclick=()=>{if(box.innerHTML){box.innerHTML="";v.textContent="Ver hoja de resultado"}else{box.innerHTML=resultCard(x);initMaps(box);v.textContent="Ocultar hoja"}};
    c.querySelector(".delh").onclick=()=>{cf.hidden=false};
    cf.querySelector(".no").onclick=()=>{cf.hidden=true};
    cf.querySelector(".yes").onclick=()=>{
      const a={type:"hdel",rec:x,i:HIST.findIndex(y=>y.id===x.id),wasLast:!!(LAST&&LAST.id===x.id)};
      record(a);toast(doAct(a,1));renderAll();
    };
    h.appendChild(c);
  });
  const all={};HIST.forEach(x=>x.faults.forEach(f=>{all[f.code]=(all[f.code]||0)+1}));
  const top=Object.entries(all).sort((a,b)=>b[1]-a[1]).slice(0,6);const fq=$("freq");
  if(!top.length){fq.innerHTML=`<div class="empty">Necesitas al menos una prueba finalizada con faltas para ver qué se repite.</div>`;return}
  const max=top[0][1];
  fq.innerHTML=`<div class="freq">${top.map(([c,n])=>`<span class="code">${c}</span><span><span style="font-size:14px">${INDEX[c].t}</span><span class="barv"><i style="width:${n/max*100}%"></i></span></span><strong class="num">${n}</strong>`).join("")}</div>`;
}
function renderHint(){$("hojaHint").textContent=active()?"Anota cada falta con su botón: círculo leve, triángulo grave, stop eliminatoria. Solo aparecen los niveles que existen para cada código.":"Pulsa Iniciar para mostrar los botones de puntuación. Fuera de la prueba, el ojo añade o quita el código de esta lista"+(SET.autoWatch?"; también se añaden solos al finalizar una prueba con faltas.":".")}
function applySettings(){
  const r=document.documentElement;if(SET.theme==="auto")r.removeAttribute("data-theme");else r.dataset.theme=SET.theme;
  document.body.classList.toggle("big",!!SET.bigButtons);
  document.body.classList.toggle("notally",!SET.showTally&&active());
  $("watchBlock").hidden=!SET.showWatch;
}
function renderAll(){applySettings();renderHint();renderBar();tick();renderQuick();renderSections();renderResult();renderHistory()}

/* Controles */
$("startBtn").onclick=()=>{
  if(S.running){S.acc=elapsed();S.running=false;wakeOff()}
  else{if(!active()){S.date=Date.now();S.track=[]}S.running=true;S.start=Date.now();startGps();wakeOn()}
  save();renderAll();
};
function finishTest(){
  closePop();if(!active())return;
  const rec={id:"h"+Date.now(),date:S.date,ms:elapsed(),faults:S.faults,track:S.track};
  HIST.push(rec);saveHist();LAST=rec;store.set("dgtsim.last",LAST);
  if(SET.autoWatch){rec.faults.forEach(f=>WATCH[f.code]=true);store.set("dgtsim.watch",WATCH)}
  S=fresh();const keep=a=>a.type!=="add"&&a.type!=="remove";undoStack=undoStack.filter(keep);redoStack=redoStack.filter(keep);save();stopGps();setGps("off","Ubicación inactiva");
  wakeOff();renderAll();showTab("resultado");toast("Prueba finalizada");
}
function openPop(){$("finishPop").hidden=false;$("finishBtn").setAttribute("aria-expanded","true");$("popNo").focus()}
function closePop(){const p=$("finishPop");if(!p)return;p.hidden=true;$("finishBtn").setAttribute("aria-expanded","false")}
$("finishBtn").onclick=e=>{e.stopPropagation();if(!active())return;if(!SET.confirmFinish){finishTest();return}$("finishPop").hidden?openPop():closePop()};
$("popYes").onclick=finishTest;
$("popNo").onclick=()=>{closePop();$("finishBtn").focus()};
$("finishPop").addEventListener("click",e=>e.stopPropagation());
document.addEventListener("click",()=>{if(!$("finishPop").hidden)closePop()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePop()});
$("undoBtn").onclick=undo;$("redoBtn").onclick=redo;
let clearArmed=false;
$("clearHist").onclick=e=>{
  if(!clearArmed){clearArmed=true;e.target.textContent="Toca otra vez para borrar todo";setTimeout(()=>{clearArmed=false;e.target.textContent="Borrar todo el historial"},3000);return}
  const a={type:"hclear",recs:HIST.slice(),last:LAST};record(a);clearArmed=false;e.target.textContent="Borrar todo el historial";toast(doAct(a,1));renderAll();
};
$("search").addEventListener("input",()=>{$("sclear").hidden=!$("search").value;renderSections()});
$("sclear").onclick=()=>{$("search").value="";$("sclear").hidden=true;renderSections();$("search").focus()};
function showTab(t){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));
  ["hoja","resultado","historial","ajustes"].forEach(x=>$("tab-"+x).hidden=x!==t);if(t==="ajustes")renderSettings();if(t==="resultado"&&LAST&&!active()){$("resultBox").innerHTML=resultCard(LAST);initMaps($("resultBox"))}$("main").scrollTop=0;
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1500)}

/* Pantalla encendida */
let wl=null;
async function wakeOn(){if(!SET.wakeLock||!S.running||!("wakeLock" in navigator))return;try{wl=await navigator.wakeLock.request("screen")}catch(e){}}
function wakeOff(){try{wl&&wl.release()}catch(e){}wl=null}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.running)wakeOn()});

/* Exportar e importar */
function exportData(){const s=Object.assign({},SET);["gClientId","autoBackup","lastBackup","backupPending","cartoKey"].forEach(k=>delete s[k]);
  return {app:"Symplo Tramo",version:1,exported:new Date().toISOString(),data:{history:HIST,last:LAST,watch:WATCH,settings:s}}}
const backupName=()=>`symplo-tramo-${new Date().toISOString().slice(0,10)}.json`;
function downloadBackup(){
  try{const blob=new Blob([JSON.stringify(exportData(),null,1)],{type:"application/json"});const u=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=u;a.download=backupName();document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
    toast("Copia descargada")}catch(e){toast("No se pudo descargar en esta vista")}
}
async function shareBackup(){
  try{const f=new File([JSON.stringify(exportData(),null,1)],backupName(),{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Copia de Symplo Tramo"});return}
  }catch(e){if(e&&e.name==="AbortError")return}
  downloadBackup();
}
function importData(obj){
  if(!obj||obj.app!=="Symplo Tramo"||!obj.data||!Array.isArray(obj.data.history))throw new Error("El archivo no es una copia de Symplo Tramo");
  const before={hist:HIST.slice(),last:LAST,watch:Object.assign({},WATCH)};
  const ids=new Set(HIST.map(x=>x.id));let added=0;const nh=HIST.slice();
  obj.data.history.forEach(x=>{if(x&&x.id&&!ids.has(x.id)&&Array.isArray(x.faults)){nh.push(x);ids.add(x.id);added++}});
  nh.sort((a,b)=>a.date-b.date);
  const nw=Object.assign({},WATCH);Object.entries(obj.data.watch||{}).forEach(([c,v])=>{if(v&&INDEX[c]&&nw[c]===undefined)nw[c]=true});
  const nl=LAST||(nh.length?nh[nh.length-1]:null);
  const a={type:"import",before,after:{hist:nh,last:nl,watch:nw}};record(a);doAct(a,1);
  return added;
}
$("importFile").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;
  try{const n=importData(JSON.parse(await f.text()));toast(n?`Importadas ${n} simulaciones`:"No había simulaciones nuevas");renderAll()}
  catch(err){toast(err.message||"No se pudo leer el archivo")}
});

/* Pantalla de ajustes */
const OPTS={
  examMin:[[20,"20 min"],[25,"25 min"],[30,"30 min"],[35,"35 min"]],
  gpsDist:[[5,"Cada 5 m"],[10,"Cada 10 m"],[15,"Cada 15 m"],[30,"Cada 30 m"]],
  mapStyle:[["auto","Conducción, según el tema"],["light","Conducción claro"],["dark","Conducción oscuro"],["roads","Carreteras en color"],["osm","Detallado (OpenStreetMap)"]],
  routeWidth:[[3,"Fino"],[4,"Medio"],[6,"Grueso"]],
  theme:[["auto","Según el dispositivo"],["light","Claro"],["dark","Oscuro"]]
};
const SW=(k,title,desc)=>`<div class="srow"><div class="sl"><b>${title}</b>${desc?`<span>${desc}</span>`:""}</div><button class="sw" type="button" role="switch" data-k="${k}" aria-checked="${!!SET[k]}" aria-label="${title}"></button></div>`;
const SL=(k,title,desc)=>`<div class="srow"><div class="sl"><b>${title}</b>${desc?`<span>${desc}</span>`:""}</div><select class="sel" data-k="${k}" aria-label="${title}">${OPTS[k].map(([v,l])=>`<option value="${v}" ${String(SET[k])===String(v)?"selected":""}>${l}</option>`).join("")}</select></div>`;
let wipeArmed=false;
function renderSettings(){
  $("settings").innerHTML=`
  <h2>Hoja</h2><div class="sgroup">
    ${SW("showWatch","Mostrar puntos a vigilar","La lista de códigos destacados al principio de la hoja.")}
    ${SW("autoWatch","Añadir faltas a puntos a vigilar","Al finalizar una prueba, sus códigos se añaden solos a la lista.")}
    ${SW("bigButtons","Botones de puntuación grandes","Más fáciles de pulsar con el coche en marcha.")}
  </div>
  <h2>Prueba</h2><div class="sgroup">
    ${SL("examMin","Duración objetivo","El cronómetro se subraya al superarla.")}
    ${SW("showTally","Recuento visible durante la prueba","Si lo desactivas, el conductor no ve cuántas faltas lleva.")}
    ${SW("confirmFinish","Confirmar antes de finalizar","Muestra el aviso de que la prueba no se podrá editar.")}
    ${SW("vibrate","Vibrar al anotar una falta","Solo en móviles compatibles. iPhone no lo permite en la web.")}
    ${SW("wakeLock","Mantener la pantalla encendida","Evita que el móvil se bloquee mientras la prueba está en marcha.")}
  </div>
  <h2>Ubicación y mapa</h2><div class="sgroup">
    ${SW("gps","Registrar ubicación y recorrido","Guarda la posición de cada falta y el trazado de la prueba.")}
    ${SL("gpsDist","Precisión del recorrido","Distancia mínima entre puntos guardados.")}
    ${SL("mapStyle","Estilo del mapa","Los estilos de conducción muestran calles y carreteras sin comercios ni puntos de interés.")}
    ${SW("mapLabels","Nombres de calles","Sin nombres el mapa queda más limpio. No afecta al estilo detallado.")}
    ${SL("routeWidth","Grosor del recorrido","")}
  </div>
  <h2>Apariencia</h2><div class="sgroup">
    ${SL("theme","Tema","")}
  </div>
  <h2>Copias de seguridad</h2>
  <p class="hint">Los datos solo se guardan en este navegador. Haz copias para no perderlos o para pasarlos a otro móvil.</p>
  <div class="sgroup">
    <div class="sbtns"><button class="sbtn" id="bExport">Descargar copia</button><button class="sbtn" id="bShare">Compartir copia</button><button class="sbtn" id="bImport">Importar copia</button></div>
    <div class="sstat">"Compartir" abre el menú del sistema para guardar el archivo en Google Drive, Archivos u otra app. Importar añade las simulaciones que falten sin borrar las actuales.</div>
  </div>
  <h2>Datos</h2>
  <div class="sgroup"><div class="sbtns"><button class="sbtn danger" id="bWipe">${wipeArmed?"Toca otra vez para borrar":"Borrar todos los datos"}</button><button class="sbtn" id="bReset">Restablecer ajustes</button></div>
    <div class="sstat">Borra historial, resultado y puntos a vigilar. Se puede deshacer mientras no cierres la app.</div></div>`;
  const S2=$("settings");
  S2.querySelectorAll(".sw").forEach(b=>b.onclick=()=>{const k=b.dataset.k;SET[k]=!SET[k];saveSet();
    if(k==="gps"){if(!SET.gps){stopGps();setGps("off","Ubicación desactivada en ajustes")}else if(S.running)startGps();else setGps("off","Ubicación inactiva")}
    if(k==="wakeLock"){SET.wakeLock?wakeOn():wakeOff()}
    renderAll();renderSettings()});
  S2.querySelectorAll(".sel").forEach(s=>s.onchange=()=>{const k=s.dataset.k,v=s.value;SET[k]=isNaN(+v)?v:+v;saveSet();renderAll();renderSettings()});
  $("bExport").onclick=downloadBackup;$("bShare").onclick=shareBackup;$("bImport").onclick=()=>$("importFile").click();
  $("bWipe").onclick=()=>{
    if(!wipeArmed){wipeArmed=true;renderSettings();setTimeout(()=>{if(wipeArmed){wipeArmed=false;renderSettings()}},3000);return}
    wipeArmed=false;const a={type:"wipe",recs:HIST.slice(),last:LAST,watch:Object.assign({},WATCH)};record(a);toast(doAct(a,1));renderAll();renderSettings()};
  $("bReset").onclick=()=>{SET=Object.assign({},DEF);saveSet();renderAll();renderSettings();toast("Ajustes restablecidos")};
}
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(SET.theme==="auto")renderAll()})}catch(e){}

/* La barra inferior nunca tapa el contenido */
function syncBar(){document.documentElement.style.setProperty("--barH",$("bar").offsetHeight+"px")}
try{new ResizeObserver(syncBar).observe($("bar"))}catch(e){}
window.addEventListener("resize",syncBar);syncBar();

if(S.running){startGps();wakeOn()}
renderAll();renderSettings();setInterval(tick,500);
</script>
